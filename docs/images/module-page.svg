<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#eef1f5"/>
  <rect x="0" y="0" width="900" height="56" fill="#2c3e50"/>
  <circle cx="28" cy="28" r="10" fill="#7f8c9a"/>
  <text x="52" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">MajorDoMo · Control panel · Modules · Starter Kit</text>

  <rect x="40" y="86" width="820" height="400" rx="6" fill="#ffffff" stroke="#d6dde6"/>
  <text x="62" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7a8c">Optional demo packages. Entities are created as regular MajorDoMo classes, objects and scripts.</text>

  <rect x="62" y="138" width="776" height="52" fill="#f7f9fb" stroke="#e4e9ef"/>
  <text x="78" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#6b7a8c">PACKAGE</text>
  <text x="740" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#6b7a8c">STATUS</text>

  <rect x="78" y="210" width="14" height="14" fill="#ffffff" stroke="#8a99aa"/>
  <text x="102" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Basic entities</text>
  <text x="218" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a99aa">v1</text>
  <text x="102" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Classes, lamp, sensor, button, thermostat and a room summary.</text>
  <text x="102" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">What it shows: hierarchy, properties, onchange hooks. How to adapt: copy the SK_* classes.</text>
  <rect x="720" y="212" width="96" height="22" rx="4" fill="#2e9e5b"/>
  <text x="768" y="227" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">installed</text>

  <rect x="78" y="278" width="14" height="14" fill="#ffffff" stroke="#8a99aa"/>
  <text x="102" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Working modes</text>
  <text x="228" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a99aa">v1</text>
  <text x="102" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">OperationalModes: Debug, Guests, Vacation + StarterModes summary hub.</text>
  <text x="102" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Requires: Basic entities</text>
  <rect x="720" y="280" width="96" height="22" rx="4" fill="#2e9e5b"/>
  <text x="768" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">installed</text>

  <rect x="78" y="346" width="14" height="14" fill="#ffffff" stroke="#8a99aa"/>
  <text x="102" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Scenes</text>
  <text x="160" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c78100">v2</text>
  <text x="102" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Six scene pages: morning, night, away, home, movie, guests.</text>
  <text x="102" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Requires: Basic entities, Working modes</text>
  <rect x="688" y="348" width="150" height="22" rx="4" fill="#c78100"/>
  <text x="763" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">update 1 → 2</text>

  <rect x="78" y="414" width="14" height="14" fill="#ffffff" stroke="#8a99aa"/>
  <text x="102" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Panel</text>
  <text x="158" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a99aa">v2</text>
  <text x="102" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Frontend tab with live cards for devices, modes, scenes and hints.</text>

  <rect x="62" y="470" width="180" height="1" fill="#e4e9ef"/>
</svg>
