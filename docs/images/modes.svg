<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380">
  <rect width="840" height="380" fill="#f2f4f7"/>
  <text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1f2d3d">Working modes (OperationalModes)</text>
  <text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7a8c">Standard MajorDoMo mode objects created by the Starter Kit; StarterModes keeps the summary.</text>

  <rect x="30" y="92" width="780" height="180" rx="6" fill="#ffffff" stroke="#dde3ea"/>
  <rect x="30" y="92" width="780" height="36" fill="#f7f9fb"/>
  <text x="48" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#6b7a8c">MODE</text>
  <text x="300" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#6b7a8c">WHAT IT DOES</text>
  <text x="700" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#6b7a8c">ACTIVE</text>

  <text x="48" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Debug</text>
  <text x="300" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#425466">Marks itself active and writes to the log</text>
  <rect x="700" y="148" width="40" height="18" rx="9" fill="#dfe5ec"/>
  <circle cx="713" cy="157" r="7" fill="#ffffff"/>

  <text x="48" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Guests</text>
  <text x="300" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#425466">Lights off, comfortable heating (21 °C)</text>
  <rect x="700" y="186" width="40" height="18" rx="9" fill="#2e9e5b"/>
  <circle cx="727" cy="195" r="7" fill="#ffffff"/>

  <text x="48" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Vacation</text>
  <text x="300" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#425466">Lights and heating off</text>
  <rect x="700" y="224" width="40" height="18" rx="9" fill="#dfe5ec"/>
  <circle cx="713" cy="233" r="7" fill="#ffffff"/>

  <rect x="30" y="292" width="780" height="64" rx="6" fill="#eef3ff" stroke="#b9cdf5"/>
  <text x="48" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#2f6feb">StarterModes.summary</text>
  <text x="48" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2d3d">Guests</text>
  <text x="520" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Toggle: SK_ModeDebug / SK_ModeGuest / SK_ModeVacation / SK_ModesOff</text>
</svg>
