<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#f5f7fa"/>
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1f2d3d">MajorDoMo Starter Kit: как всё связано</text>
  <text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6b7c">Необязательный модуль, штатные сущности MajorDoMo, без изменений ядра и схемы БД</text>

  <rect x="40" y="110" width="210" height="90" rx="10" fill="#2f6feb"/>
  <text x="145" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Модуль Starter Kit</text>
  <text x="145" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dbe7ff">список пакетов, установка, обновление</text>

  <rect x="310" y="96" width="250" height="118" rx="10" fill="#ffffff" stroke="#c9d5e3"/>
  <text x="330" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Пакеты</text>
  <text x="330" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Базовые сущности, Режимы,</text>
  <text x="330" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Сцены, Скрипты, Подсказки,</text>
  <text x="330" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Панель, Часы, Солнце</text>

  <rect x="620" y="80" width="300" height="150" rx="10" fill="#ffffff" stroke="#c9d5e3"/>
  <text x="640" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Созданные сущности</text>
  <text x="640" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">классы, объекты, свойства</text>
  <text x="640" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">методы, скрипты, сцены</text>
  <text x="640" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">шаблоны классов, текстовые файлы</text>
  <text x="640" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">макеты, OperationalModes</text>
  <text x="640" y="214" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8595a6">неизменённые сущности можно удалить</text>

  <rect x="310" y="280" width="250" height="120" rx="10" fill="#ffffff" stroke="#c9d5e3"/>
  <text x="330" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Путь обучения</text>
  <text x="330" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">1. устройства и onchange</text>
  <text x="330" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">2. сцены и режимы</text>
  <text x="330" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">3. скрипты и хуки Timer</text>

  <rect x="620" y="280" width="300" height="120" rx="10" fill="#ffffff" stroke="#c9d5e3"/>
  <text x="640" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Фронтенд</text>
  <text x="640" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">вкладка «Панель Starter»</text>
  <text x="640" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">страницы сцен</text>
  <text x="640" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">живые %Object.Property|10%</text>

  <line x1="250" y1="155" x2="300" y2="155" stroke="#2f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="155" x2="610" y2="155" stroke="#2f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="435" y1="214" x2="435" y2="270" stroke="#2f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="340" x2="610" y2="340" stroke="#2f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/>
    </marker>
  </defs>
</svg>
