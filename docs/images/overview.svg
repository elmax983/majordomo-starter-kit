<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#f5f7fa"/>
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1f2d3d">MajorDoMo Starter Kit: how it fits together</text>
  <text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6b7c">Optional module, regular MajorDoMo entities, no core or schema changes</text>

  <rect x="40" y="110" width="210" height="90" rx="10" fill="#2f6feb"/>
  <text x="145" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Starter Kit module</text>
  <text x="145" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dbe7ff">package list, install, update</text>

  <rect x="310" y="96" width="250" height="118" rx="10" fill="#ffffff" stroke="#c9d5e3"/>
  <text x="330" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Packages</text>
  <text x="330" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Basic entities, Modes, Scenes,</text>
  <text x="330" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Scripts, Hints, Panel,</text>
  <text x="330" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Clock, Sun</text>

  <rect x="620" y="80" width="300" height="150" rx="10" fill="#ffffff" stroke="#c9d5e3"/>
  <text x="640" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Created entities</text>
  <text x="640" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">classes, objects, properties</text>
  <text x="640" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">methods, scripts, scenes</text>
  <text x="640" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">class templates, text files</text>
  <text x="640" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">layouts, OperationalModes</text>
  <text x="640" y="214" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8595a6">all unchanged entities are removable</text>

  <rect x="310" y="280" width="250" height="120" rx="10" fill="#ffffff" stroke="#c9d5e3"/>
  <text x="330" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Learning path</text>
  <text x="330" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">1. devices and onchange</text>
  <text x="330" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">2. scenes and modes</text>
  <text x="330" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">3. scripts and Timer hooks</text>

  <rect x="620" y="280" width="300" height="120" rx="10" fill="#ffffff" stroke="#c9d5e3"/>
  <text x="640" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Frontend</text>
  <text x="640" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Starter panel tab</text>
  <text x="640" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">scene pages</text>
  <text x="640" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">live %Object.Property|10% values</text>

  <line x1="250" y1="155" x2="300" y2="155" stroke="#2f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="155" x2="610" y2="155" stroke="#2f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="435" y1="214" x2="435" y2="270" stroke="#2f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="340" x2="610" y2="340" stroke="#2f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/>
    </marker>
  </defs>
</svg>
