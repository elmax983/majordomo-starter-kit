<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#eef1f5"/>
  <rect x="0" y="0" width="900" height="56" fill="#2c3e50"/>
  <circle cx="28" cy="28" r="10" fill="#7f8c9a"/>
  <text x="52" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">MajorDoMo · Панель управления · Модули · Starter Kit</text>

  <rect x="40" y="86" width="820" height="400" rx="6" fill="#ffffff" stroke="#d6dde6"/>
  <text x="62" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7a8c">Необязательные наборы примеров. Создаются обычные классы, объекты и скрипты MajorDoMo.</text>

  <rect x="62" y="138" width="776" height="52" fill="#f7f9fb" stroke="#e4e9ef"/>
  <text x="78" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#6b7a8c">НАБОР</text>
  <text x="740" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#6b7a8c">СТАТУС</text>

  <rect x="78" y="210" width="14" height="14" fill="#ffffff" stroke="#8a99aa"/>
  <text x="102" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Базовые сущности</text>
  <text x="238" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a99aa">v1</text>
  <text x="102" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Классы, лампа, датчик, кнопка, термостат и сводка комнаты.</text>
  <text x="102" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Что показывает: иерархию, свойства, onchange. Как адаптировать: скопировать классы SK_*.</text>
  <rect x="720" y="212" width="96" height="22" rx="4" fill="#2e9e5b"/>
  <text x="768" y="227" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">установлен</text>

  <rect x="78" y="278" width="14" height="14" fill="#ffffff" stroke="#8a99aa"/>
  <text x="102" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Режимы работы</text>
  <text x="224" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a99aa">v1</text>
  <text x="102" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">OperationalModes: Debug, Гости, Отпуск + хаб StarterModes.</text>
  <text x="102" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Требует: Базовые сущности</text>
  <rect x="720" y="280" width="96" height="22" rx="4" fill="#2e9e5b"/>
  <text x="768" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">установлен</text>

  <rect x="78" y="346" width="14" height="14" fill="#ffffff" stroke="#8a99aa"/>
  <text x="102" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Сцены</text>
  <text x="158" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c78100">v2</text>
  <text x="102" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Шесть сцен: утро, ночь, ушли, пришли, кино, гости.</text>
  <text x="102" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Требует: Базовые сущности, Режимы работы</text>
  <rect x="688" y="348" width="150" height="22" rx="4" fill="#c78100"/>
  <text x="763" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">обновление 1 → 2</text>

  <rect x="78" y="414" width="14" height="14" fill="#ffffff" stroke="#8a99aa"/>
  <text x="102" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f2d3d">Панель</text>
  <text x="170" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a99aa">v2</text>
  <text x="102" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b7c">Вкладка фронтенда с живыми карточками устройств, режимов, сцен и подсказок.</text>

  <rect x="62" y="470" width="180" height="1" fill="#e4e9ef"/>
</svg>
